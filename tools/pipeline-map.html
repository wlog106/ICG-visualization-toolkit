<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pipeline Exam Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">

</head><body><main>
<header>
  <a class="back" href="../index.html">← ICG visualization toolkit</a>
  <h1>Pipeline Exam Map</h1>
  <p class="lede">The graphics pipeline from model to frame buffer, with the midterm topics that belong to each stage.</p>
</header>
<div class="svgwrap">
<svg viewBox="0 0 680 590" role="img"><title>Graphics pipeline with exam topics</title><desc>Seven pipeline stages from model transform to frame buffer, each annotated with the exam topics that live at that stage.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="40" y="24">Pipeline stage</text><text class="ts" x="330" y="24">What the exam asks about it</text>
<g class="c-purple"><rect x="40" y="40" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="57" text-anchor="middle" dominant-baseline="central">1 · Model transform</text><text class="ts" x="170" y="75" text-anchor="middle" dominant-baseline="central">object → world</text></g>
<text class="t" x="330" y="58">T, R, S as 4×4 matrices; why 4D</text><text class="ts" x="330" y="76">Animation problem parts (a)(b)</text>
<line x1="170" y1="88" x2="170" y2="100" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="102" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="119" text-anchor="middle" dominant-baseline="central">2 · View transform</text><text class="ts" x="170" y="137" text-anchor="middle" dominant-baseline="central">world → camera</text></g>
<text class="t" x="330" y="120">Camera = inverse of its placement</text><text class="ts" x="330" y="138">Animation part (c): Inv(M_eye)</text>
<line x1="170" y1="150" x2="170" y2="162" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="164" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="181" text-anchor="middle" dominant-baseline="central">3 · Projection + normalize</text><text class="ts" x="170" y="199" text-anchor="middle" dominant-baseline="central">camera → 2×2×2 cube</text></g>
<text class="t" x="330" y="182">Ortho / oblique / perspective, one pipeline</text><text class="ts" x="330" y="200">Normalized volume (every year)</text>
<line x1="170" y1="212" x2="170" y2="224" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="226" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="243" text-anchor="middle" dominant-baseline="central">4 · Clipping</text><text class="ts" x="170" y="261" text-anchor="middle" dominant-baseline="central">cut away what's outside</text></g>
<text class="t" x="330" y="244">Cohen–Sutherland outcodes</text><text class="ts" x="330" y="262">Concept, necessity, limits, speed-ups</text>
<line x1="170" y1="274" x2="170" y2="286" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="288" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="305" text-anchor="middle" dominant-baseline="central">5 · Divide by w, viewport</text><text class="ts" x="170" y="323" text-anchor="middle" dominant-baseline="central">cube → screen pixels</text></g>
<text class="t" x="330" y="306">Order of all transforms</text><text class="ts" x="330" y="324">2024 Q3(a), 15 pts</text>
<line x1="170" y1="336" x2="170" y2="348" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="350" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="367" text-anchor="middle" dominant-baseline="central">6 · Rasterize triangles</text><text class="ts" x="170" y="385" text-anchor="middle" dominant-baseline="central">triangle → fragments</text></g>
<text class="t" x="330" y="368">Why triangles / convex polygons</text><text class="ts" x="330" y="386">Interpolation across the triangle</text>
<line x1="170" y1="398" x2="170" y2="410" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="412" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="429" text-anchor="middle" dominant-baseline="central">7 · Shading</text><text class="ts" x="170" y="447" text-anchor="middle" dominant-baseline="central">color every fragment</text></g>
<text class="t" x="330" y="430">Phong reflection model (every year)</text><text class="ts" x="330" y="448">Flat / Gouraud / Phong; local vs global</text>
<line x1="170" y1="460" x2="170" y2="472" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="474" width="260" height="44" rx="8" stroke-width="0.5"/><text class="th" x="170" y="496" text-anchor="middle" dominant-baseline="central">Frame buffer → display</text>
<text class="t" x="330" y="496">Ch0–1: raster, frame buffer, RGB</text>
<line x1="20" y1="40" x2="20" y2="336" stroke="#7F77DD" stroke-width="2"/>
<line x1="20" y1="350" x2="20" y2="460" stroke="#1D9E75" stroke-width="2"/>
<rect class="c-purple" x="40" y="548" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="62" y="559">Vertex shader territory (per vertex)</text>
<rect class="c-teal" x="330" y="548" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="352" y="559">Fragment shader territory (per pixel)</text>
</svg></div>
</main></body></html>
